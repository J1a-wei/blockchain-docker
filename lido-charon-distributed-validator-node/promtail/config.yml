server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/api/prom/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        replacement: "$1"
        target_label: "container"
      - source_labels: ["container"]
        regex: ".*charon.*"
        replacement: "lido-charon"
        target_label: "job"
      - source_labels: ["container"]
        regex: ".*geth.*"
        replacement: "lido-geth"
        target_label: "job"
      - source_labels: ["container"]
        regex: ".*lodestar.*"
        replacement: "lido-lodestar"
        target_label: "job"
      - source_labels: ["container"]
        regex: ".*prysm.*"
        replacement: "lido-prysm"
        target_label: "job"
      - target_label: "cluster_name"
        replacement: $CLUSTER_NAME
      - target_label: "cluster_peer"
        replacement: $CLUSTER_PEER
    pipeline_stages:
      - docker: {}
